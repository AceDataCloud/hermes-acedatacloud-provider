name: Validate Hermes provider

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: NousResearch/hermes-agent/.github/actions/plugin-validate@1d6b2786e2b2de70a967c66b6a14e2b83bab30e7
        with:
          path: ${{ github.workspace }}
          hermes-ref: "1d6b2786e2b2de70a967c66b6a14e2b83bab30e7"
      - name: Run discovery and catalog behavior contracts
        shell: bash
        run: |
          set -euo pipefail
          hermes_source=("$RUNNER_TEMP"/hermes-plugin-validator.*)
          export HERMES_SOURCE="${hermes_source[0]}"
          "$HERMES_SOURCE/.build/validator/bin/python" -m unittest discover -s tests -v
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: stable-python
        with:
          python-version: "3.13"
      - name: Verify stable release with its own locked dependencies
        shell: bash
        env:
          STABLE_PYTHON: ${{ steps.stable-python.outputs.python-path }}
        run: |
          set -euo pipefail
          hermes_source=("$RUNNER_TEMP"/hermes-plugin-validator.*)
          validator_python="${hermes_source[0]}/.build/validator/bin/python"
          stable_source=$(mktemp -d "$RUNNER_TEMP/hermes-stable.XXXXXX")
          git -C "$stable_source" init
          git -C "$stable_source" remote add origin https://github.com/NousResearch/hermes-agent.git
          git -C "$stable_source" fetch --depth=1 origin f97608f178d1ffeca59860195ab7da295f7c8e5f
          git -C "$stable_source" checkout --detach FETCH_HEAD
          "$validator_python" -m pm.build_env --source "$stable_source" --out "$RUNNER_TEMP/hermes-stable-env" --python "$STABLE_PYTHON"
          stable_python="$RUNNER_TEMP/hermes-stable-env/bin/python"
          export HERMES_SOURCE="$stable_source"
          "$stable_python" -m unittest discover -s tests -v
          export HERMES_HOME="$RUNNER_TEMP/hermes-stable-home"
          export HERMES_RUNTIME_DIR="$RUNNER_TEMP/hermes-stable-runtime"
          export PYTHONPATH="$stable_source"
          "$stable_python" -m hermes_cli.main plugins validate "$GITHUB_WORKSPACE" --install-deps
      - name: Accept the published catalog on the stable release
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          stable_source=("$RUNNER_TEMP"/hermes-stable.*)
          export HERMES_SOURCE="${stable_source[0]}"
          "$RUNNER_TEMP/hermes-stable-env/bin/python" scripts/check_published_catalog.py
